name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        configuration: [release]
        platform: [x64, x86, arm64]
      fail-fast: false

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: ${{matrix.configuration}}
      BUILD_PLATFORM: ${{matrix.platform}}
      BIN_PATH: ${{github.workspace}}\src\bin
    # windows-latest ships VS 2026 without v143 ARM64 tools; the projects target v143.
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check tag matches version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $wxi = Get-Content src/setup/wix/var.wxi -Raw
        if($wxi -notmatch "Version\s*=\s*'([0-9.]+)'") { throw 'No version in var.wxi' }
        if("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match var.wxi version $($Matches[1])" }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build shell extension
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{env.SOLUTION_FILE_PATH}}

    - name: Set up code signing
      shell: pwsh
      env:
        PFX_BASE64: ${{ secrets.CS_SIGN_PFX_BASE64 }}
        PFX_PASSWORD: ${{ secrets.CS_SIGN_PASSWORD }}
      run: |
        if(-not $env:PFX_BASE64) { Write-Host 'No signing certificate configured; building unsigned.'; exit 0 }
        $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
        "CS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
        "CS_SIGN_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

    - name: Build installer
      shell: pwsh
      run: ./src/setup/build-installer.ps1 -Platform ${{matrix.platform}} -Repository ${{github.repository}}

    - name: Render UI screenshots
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        $out = Join-Path $env:RUNNER_TEMP 'screenshots'
        $p = Start-Process "$env:BIN_PATH\setup-x64.exe" -ArgumentList "/screenshots `"$out`"" -PassThru -Wait
        if($p.ExitCode) { throw "setup screenshots failed ($($p.ExitCode))" }
        $p = Start-Process "$env:BIN_PATH\ContextShell.exe" -ArgumentList "--screenshots `"$out`" --config `"$env:BIN_PATH`"" -PassThru -Wait
        if($p.ExitCode) { throw "settings screenshots failed ($($p.ExitCode))" }
        Get-ChildItem $out | Select-Object Name, Length

    - name: Upload screenshots
      if: matrix.platform == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: ${{runner.temp}}\screenshots
        retention-days: 14

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: contextshell-${{matrix.platform}}
        path: |
          ${{env.BIN_PATH}}\*
          !${{env.BIN_PATH}}\*.lib
          !${{env.BIN_PATH}}\*.exp
          !${{env.BIN_PATH}}\*.pdb
          !${{env.BIN_PATH}}\*.wixpdb
          !${{env.BIN_PATH}}\ca.dll
        if-no-files-found: error
        retention-days: 14
        compression-level: 6

  # Installs, upgrades, repairs and removes ContextShell on a clean runner.
  test-install:
    needs: build
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: contextshell-x64
        path: dist
    - name: Install, upgrade, repair and uninstall
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./src/setup/test-installer.ps1 -Dist dist -Repository ${{github.repository}}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: contextshell-*

    - name: Package
      run: |
        mkdir release
        for dir in dist/contextshell-*; do
          arch="${dir##*-}"
          mv "$dir/setup-$arch.exe" "release/ContextShell-${GITHUB_REF_NAME}-${arch}-setup.exe"
          mv "$dir/setup-$arch.msi" "release/ContextShell-${GITHUB_REF_NAME}-${arch}.msi"
          (cd "$dir" && zip -r "../../release/ContextShell-${GITHUB_REF_NAME}-${arch}-portable.zip" .)
        done
        # The in-app updater only runs installers that match this file.
        (cd release && sha256sum * > SHA256SUMS.txt)
        ls -l release
        cat release/SHA256SUMS.txt

    - name: Publish release
      env:
        GH_TOKEN: ${{github.token}}
      run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "ContextShell $GITHUB_REF_NAME" --generate-notes
